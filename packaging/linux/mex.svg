<!-- Palette follows the TUI: near-black tile, gray borders/dividers, -->
<!-- white bright rows, cyan headers, green hex/local accents. -->
<svg
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient
       id="tile"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#232323" />
      <stop
         offset="1"
         stop-color="#101010" />
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect
     x="4"
     y="4"
     width="56"
     height="56"
     rx="9"
     fill="url(#tile)"
     stroke="#5a5a5a"
     stroke-width="1.5" />
  <!-- header bar (rounded top only) -->
  <path
     d="M4 13 v-0 A9 9 0 0 1 13 4 h38 A9 9 0 0 1 60 13 Z"
     fill="#2e2e2e" />
  <circle
     cx="12"
     cy="8.5"
     r="2.3"
     fill="#d95f57" />
  <circle
     cx="19"
     cy="8.5"
     r="2.3"
     fill="#d9a13b" />
  <circle
     cx="26"
     cy="8.5"
     r="2.3"
     fill="#3fa34d" />
  <!-- TUI top bar: cyan "mex" mark + stats line, bordered below -->
  <rect
     x="8"
     y="17"
     width="7"
     height="3.2"
     rx="1"
     fill="#358585" />
  <line
     x1="17"
     y1="18.6"
     x2="40"
     y2="18.6"
     stroke="#5f5f5f"
     stroke-width="2.2"
     stroke-linecap="round" />
  <line
     x1="8"
     y1="22.5"
     x2="56"
     y2="22.5"
     stroke="#4a4a4a"
     stroke-width="1.2" />
  <!-- left pane: hosts tree (selected row = reversed/white) -->
  <rect
     x="8"
     y="25"
     width="19"
     height="8"
     rx="2.5"
     fill="#d9d9d9" />
  <circle
     cx="12.5"
     cy="29"
     r="1.8"
     fill="#1a1a1a" />
  <line
     x1="16"
     y1="29"
     x2="23.5"
     y2="29"
     stroke="#1a1a1a"
     stroke-width="2.2"
     stroke-linecap="round" />
  <circle
     cx="12.5"
     cy="37"
     r="1.8"
     fill="#7d7d7d" />
  <line
     x1="16"
     y1="37"
     x2="23.5"
     y2="37"
     stroke="#5f5f5f"
     stroke-width="2.2"
     stroke-linecap="round" />
  <circle
     cx="12.5"
     cy="44"
     r="1.8"
     fill="#7d7d7d" />
  <line
     x1="16"
     y1="44"
     x2="22"
     y2="44"
     stroke="#5f5f5f"
     stroke-width="2.2"
     stroke-linecap="round" />
  <circle
     cx="12.5"
     cy="50.5"
     r="1.8"
     fill="#7d7d7d" />
  <line
     x1="16"
     y1="50.5"
     x2="23.5"
     y2="50.5"
     stroke="#5f5f5f"
     stroke-width="2.2"
     stroke-linecap="round" />
  <!-- vertical pane divider -->
  <line
     x1="30.5"
     y1="24"
     x2="30.5"
     y2="56.5"
     stroke="#4a4a4a"
     stroke-width="1.6" />
  <!-- right top: answers (bright + dim rows) -->
  <line
     x1="34"
     y1="28"
     x2="54"
     y2="28"
     stroke="#ededed"
     stroke-width="2.6"
     stroke-linecap="round" />
  <line
     x1="34"
     y1="33"
     x2="49"
     y2="33"
     stroke="#5f5f5f"
     stroke-width="2.6"
     stroke-linecap="round" />
  <!-- horizontal divider -->
  <line
     x1="34"
     y1="37.5"
     x2="54"
     y2="37.5"
     stroke="#4a4a4a"
     stroke-width="1.4" />
  <!-- right middle: questions (cyan header accent) -->
  <line
     x1="34"
     y1="41.5"
     x2="51"
     y2="41.5"
     stroke="#358585"
     stroke-width="2.6"
     stroke-linecap="round" />
  <!-- horizontal divider -->
  <line
     x1="34"
     y1="45.5"
     x2="54"
     y2="45.5"
     stroke="#4a4a4a"
     stroke-width="1.4" />
  <!-- right bottom: hex bytes (green text on dark) -->
  <g>
    <rect x="34" y="48" width="4.5" height="2.8" rx="0.8" fill="#4a4a4a" />
    <rect x="40" y="48" width="4.5" height="2.8" rx="0.8" fill="#4a4a4a" />
    <rect x="46" y="48" width="4.5" height="2.8" rx="0.8" fill="#4a4a4a" />
    <rect x="34" y="52" width="4.5" height="2.8" rx="0.8" fill="#4a4a4a" />
    <rect x="40" y="52" width="4.5" height="2.8" rx="0.8" fill="#527a52" />
    <rect x="46" y="52" width="4.5" height="2.8" rx="0.8" fill="#4a4a4a" />
  </g>
</svg>
