name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read

concurrency:
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-release:
    name: "🏷️ Check release tag"
    runs-on: ubuntu-slim
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: 🏷️ Check for release
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          is_release=false
          if [ "$EVENT_NAME" = "push" ]; then
            # The tag does not exist yet when CI starts: release-please
            # creates it after this same push, so fall back to matching
            # the release-please commit message.
            if git tag --points-at HEAD | grep -q '^v'; then
              is_release=true
            elif git log -1 --pretty=%B | grep -qE '^chore(\(main\))?: release '; then
              is_release=true
            fi
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

  changes:
    name: "🔍 Detect Changes"
    needs:
      - check-release
    if: needs.check-release.outputs.is_release != 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read # Needed to checkout code for change detection
      pull-requests: read # Needed for dorny/paths-filter to list PR files via API
    outputs:
      aur: ${{ steps.filter.outputs.aur }}
      branch: ${{ steps.branch.outputs.branch }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🔍 Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            aur:
              - '.github/workflows/aur-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
              - 'packaging/**'
            code:
              - '.github/actions/setup-*/**'
              - '.github/actions/sbom/**'
              - '.github/workflows/build-reusable.yml'
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Cross.toml'
              - 'packaging/linux/**'
              - 'packaging/macos/**'
              - 'packaging/windows/**'
      - name: Output branch name
        id: branch
        run: |
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

  typos:
    name: "📝 Check typos"
    needs:
      - check-release
    if: always() && needs.check-release.outputs.is_release != 'true'
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@a2e70543f16acf3105219e0e944c323afe88b269 # v2.14.13

  lint:
    name: "📎 Lint"
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          components: rustfmt, clippy
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: ⚡ Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: 🎨 Check formatting
        shell: bash
        run: cargo fmt --check

      - name: 📎 Clippy
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: "🧪 Test"
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: ⚡ Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: 🧪 Test
        shell: bash
        run: cargo test --locked

  build:
    name: "🔨 Build"
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: write # Needed to run build, upload release assets, and pass permissions to reusable workflow
      id-token: write # Needed for OIDC token for attestation
      attestations: write # Needed to create build attestations
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      branch: ${{ needs.changes.outputs.branch }}
      profile: debug
      upload_artifacts: ${{ github.event_name != 'pull_request' }}

  aur:
    name: AUR
    needs:
      - changes
    if: needs.changes.outputs.aur == 'true'
    permissions:
      contents: read # Needed to checkout code and run local scripts for AUR build
      packages: read # Needed to read container image for AUR build
    uses: ./.github/workflows/aur-reusable.yml

  lockfile-fresh:
    name: "🔒 Lockfile Fresh"
    needs:
      - check-release
    if: needs.check-release.outputs.is_release != 'true' && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; the check never commits anything
    steps:
      - name: 🔄 Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache

      - name: 🔒 Verify lockfile is fully maximized
        shell: bash
        run: |
          cargo update --manifest-path Cargo.toml
          if ! git diff --quiet -- Cargo.lock; then
            echo "::error::Cargo.lock is not fully maximized. Run Renovate lock maintenance and let release-please refresh this PR (CI re-runs automatically on the update)."
            git diff --stat -- Cargo.lock
            exit 1
          fi
          echo "Cargo.lock is fully maximized"

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - check-release
      - changes
      - lint
      - test
      - build
      - aur
      - lockfile-fresh
      - typos
    if: always()
    steps:
      - name: Check whether all jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            changes,
            typos,
            lint,
            test,
            build,
            aur,
            lockfile-fresh
          jobs: ${{ toJSON(needs) }}
