name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typos:
    name: "📝 Check typos"
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@a2e70543f16acf3105219e0e944c323afe88b269 # v2.14.13

  lint:
    name: "📎 Lint"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          components: rustfmt, clippy
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: ⚡ Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: 🎨 Check formatting
        shell: bash
        run: cargo fmt --check

      - name: 📎 Clippy
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: ⚡ Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: 🧪 Test
        shell: bash
        run: cargo test --locked

  build:
    name: "🔨 Build"
    permissions:
      contents: read # Needed to run build and pass permissions to reusable workflow
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      branch: ${{ github.ref_name }}
      profile: debug
      upload_artifacts: ${{ github.event_name != 'pull_request' }}

  lockfile-fresh:
    name: "🔒 Lockfile Fresh"
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; the check never commits anything
    steps:
      - name: 🔄 Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache

      - name: 🔒 Verify lockfile is fully maximized
        shell: bash
        run: |
          cargo update --manifest-path Cargo.toml
          if ! git diff --quiet -- Cargo.lock; then
            echo "::error::Cargo.lock is not fully maximized. Run Renovate lock maintenance and let release-please refresh this PR (CI re-runs automatically on the update)."
            git diff --stat -- Cargo.lock
            exit 1
          fi
          echo "Cargo.lock is fully maximized"

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
      - lockfile-fresh
      - typos
    if: always()
    steps:
      - name: Check whether all jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: lockfile-fresh
          jobs: ${{ toJSON(needs) }}
