name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: "📎 Lint"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          components: rustfmt, clippy
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: ⚡ Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: 🎨 Check formatting
        shell: bash
        run: cargo fmt --check

      - name: 📎 Clippy
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: ⚡ Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: 🧪 Test
        shell: bash
        run: cargo test --locked

  build:
    name: "🔨 Build"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: ⚡ Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: 🔨 Build
        shell: bash
        run: cargo build --locked

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
    if: always()
    steps:
      - name: Check whether all jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
