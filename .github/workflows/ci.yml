name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: "📎 Lint"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 📦 Cache
        uses: Swatinem/rust-cache@v2

      - name: 🎨 Check formatting
        shell: bash
        run: cargo fmt --check

      - name: 📎 Clippy
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Cache
        uses: Swatinem/rust-cache@v2

      - name: 🧪 Test
        shell: bash
        run: cargo test --locked

  build:
    name: "🔨 Build"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Cache
        uses: Swatinem/rust-cache@v2

      - name: 🔨 Build
        shell: bash
        run: cargo build --locked

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
    if: always()
    steps:
      - name: Check whether all jobs succeeded
        uses: re-actors/alls-green@v1
        with:
          jobs: ${{ toJSON(needs) }}
