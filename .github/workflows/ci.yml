name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read

concurrency:
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-release:
    name: "🏷️ Check release tag"
    runs-on: ubuntu-slim
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: 🏷️ Check for release
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          is_release=false
          if [ "$EVENT_NAME" = "push" ]; then
            # The tag does not exist yet when CI starts: release-please
            # creates it after this same push, so fall back to matching
            # the release-please commit message.
            if git tag --points-at HEAD | grep -q '^v'; then
              is_release=true
            elif git log -1 --pretty=%B | grep -qE '^chore(\(main\))?: release '; then
              is_release=true
            fi
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

  changes:
    name: "🔍 Detect Changes"
    needs:
      - check-release
    if: needs.check-release.outputs.is_release != 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read # Needed to checkout code for change detection
      pull-requests: read # Needed for dorny/paths-filter to list PR files via API
    outputs:
      aur: ${{ steps.filter.outputs.aur }}
      branch: ${{ steps.branch.outputs.branch }}
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🔍 Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            aur:
              - '.github/workflows/aur-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
              - 'packaging/**'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/actions/sbom/**'
            code:
              - '.github/actions/setup-*/**'
              - '.github/actions/sbom/**'
              - '.github/workflows/build-reusable.yml'
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Cross.toml'
              - 'packaging/linux/**'
              - 'packaging/macos/**'
              - 'packaging/windows/**'
      - name: Output branch name
        id: branch
        run: |
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

  typos:
    name: "📝 Check typos"
    needs:
      - check-release
    if: always() && needs.check-release.outputs.is_release != 'true'
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@0d30078875c008b02cb2575ce5af3bd222ef2ee3 # v2.15.0

  spdx:
    name: "📜 License headers"
    needs:
      - check-release
    if: always() && needs.check-release.outputs.is_release != 'true'
    uses: hrzlgnm/actions/.github/workflows/spdx-reusable.yml@0d30078875c008b02cb2575ce5af3bd222ef2ee3 # v2.15.0

  lint:
    name: "📎 Lint"
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: ⚡ Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: 🎨 Check formatting
        shell: bash
        run: cargo fmt --check

      - name: 📎 Clippy
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

      # Type-checks the macOS cfg code without a scarce macOS runner;
      # nothing links, so no Apple SDK is needed.
      - name: 🍏 Clippy (macOS targets)
        shell: bash
        run: cargo clippy --all-targets --target aarch64-apple-darwin --target x86_64-apple-darwin -- -D warnings

      # Type-checks the Windows cfg code, tests included: the Windows
      # build job only builds the release binary, so the test build was
      # never compiled there. Nothing links, so no MSVC toolchain is needed.
      - name: 🪟 Clippy (Windows target)
        shell: bash
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  test:
    name: "🧪 Test"
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: ⚡ Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: 🧪 Test
        shell: bash
        run: cargo test --locked

  # Informational only: not part of CI Status and no threshold, so the
  # coverage tooling never blocks a merge. Kept apart from `test` and
  # without sccache, so instrumented objects stay out of the build caches.
  coverage:
    name: "📊 Coverage"
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to checkout code
      id-token: write # Needed for tokenless Codecov upload via GitHub OIDC
    env:
      # Report production code only: tests live in `src/*/tests/`.
      COVERAGE_IGNORE_REGEX: "(^|/)src/.*/tests/"
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          components: llvm-tools-preview

      - name: 🧰 Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: 🧪 Run tests with coverage
        shell: bash
        run: cargo llvm-cov --locked --no-report

      - name: 📊 Render coverage reports
        shell: bash
        run: |
          report() { cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" "$@"; }
          mkdir -p coverage
          {
            echo '## 📊 Coverage'
            echo
            echo '```text'
            report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          report --lcov --output-path coverage/lcov.info
          report --html --output-dir coverage

      - name: 📤 Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Best-effort: coverage stays informational and never gates CI. The
      # action skips OIDC on fork PRs, where the badge still reflects main.
      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true # Also covers failures before the upload step (e.g. OIDC token retrieval)
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  build:
    name: "🔨 Build"
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: write # Needed to run build, upload release assets, and pass permissions to reusable workflow
      id-token: write # Needed for OIDC token for attestation
      attestations: write # Needed to create build attestations
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      branch: ${{ needs.changes.outputs.branch }}
      profile: debug
      upload_artifacts: ${{ github.event_name != 'pull_request' }}
      full_matrix: ${{ github.event_name != 'pull_request' }}
      # PRs scan the SBOM only when dependencies change; main always does.
      sbom: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' }}

  aur:
    name: AUR
    needs:
      - changes
    if: needs.changes.outputs.aur == 'true'
    permissions:
      contents: read # Needed to checkout code and run local scripts for AUR build
      packages: read # Needed to read container image for AUR build
    uses: ./.github/workflows/aur-reusable.yml

  lockfile-fresh:
    name: "🔒 Lockfile Fresh"
    needs:
      - check-release
    if: needs.check-release.outputs.is_release != 'true' && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; the check never commits anything
    steps:
      - name: 🔄 Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀 Setup Rust cache
        uses: ./.github/actions/setup-rust-cache

      - name: 🔒 Verify lockfile is fully maximized
        shell: bash
        run: |
          cargo update --manifest-path Cargo.toml
          if ! git diff --quiet -- Cargo.lock; then
            echo "::error::Cargo.lock is not fully maximized. Run Renovate lock maintenance and let release-please refresh this PR (CI re-runs automatically on the update)."
            git diff --stat -- Cargo.lock
            exit 1
          fi
          echo "Cargo.lock is fully maximized"

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - check-release
      - changes
      - spdx
      - lint
      - test
      - build
      - aur
      - lockfile-fresh
      - typos
    if: always()
    steps:
      - name: Check whether all jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            changes,
            spdx,
            typos,
            lint,
            test,
            build,
            aur,
            lockfile-fresh
          jobs: ${{ toJSON(needs) }}
