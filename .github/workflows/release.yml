name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # to open Release PRs, tag, and create draft releases
  issues: write # to manage autorelease labels on Release PRs
  pull-requests: write # to open and update Release PRs

jobs:
  release-please:
    name: "🤖 Release Please"
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build_and_publish:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
    name: 🔨 Build and Publish
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ needs.release-please.outputs.tag_name }}
      profile: release

  approve-release-pr:
    needs: [release-please]
    if: needs.release-please.outputs.prs_created == 'true'
    permissions:
      actions: write # needed to approve workflow runs
      contents: read
      pull-requests: read
    name: "✅ Approve Release PR workflows"
    uses: hrzlgnm/actions/.github/workflows/approve-bot-pr-reusable.yml@a2e70543f16acf3105219e0e944c323afe88b269 # v2.14.13
    with:
      branch: release-please--branches--main--components--mex

  source_checksums:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # to upload source checksums to release
    name: 🔢 Generate Source Checksums
    uses: ./.github/workflows/source-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ needs.release-please.outputs.tag_name }}

  publish:
    # Flips the draft live only when every build job succeeded. A cancelled
    # or failed build skips this job, so a partial release never goes live.
    needs: [release-please, source_checksums, build_and_publish]
    if: needs.release-please.outputs.release_created == 'true'
    name: "📢 Publish Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the draft release
      actions: write # to dispatch the downstream packaging workflow
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📢 Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false --prerelease=false

      - name: 🚀 Dispatch AUR packaging workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh workflow run aur-reusable.yml --ref "$REF_NAME" -f tag_name="$TAG_NAME"; then
            echo "::error::Failed to dispatch aur-reusable.yml"
            exit 1
          fi
