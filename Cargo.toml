[package]
name = "mex"
version = "0.16.0"
edition = "2021"
license = "MIT"
description = "Terminal UI to browse and debug mDNS/DNS-SD on the local link — live services, records, queries, raw packets, and anomaly detection"

[package.metadata.deb]
maintainer = "hrzlgnm"
copyright = "Copyright 2026 hrzlgnm"
license-file = "LICENSE"
depends = "libgcc-s1 (>= 4.2)"
assets = [
    [
        "target/release/mex",
        "usr/bin/",
        "755",
    ],
    [
        "docs/mex.1",
        "usr/share/man/man1/mex.1",
        "644",
    ],
    [
        "packaging/linux/mex.desktop",
        "usr/share/applications/mex.desktop",
        "644",
    ],
    [
        "packaging/linux/mex.svg",
        "usr/share/icons/hicolor/scalable/apps/mex.svg",
        "644",
    ],
    [
        "target/debian/changelog.gz",
        "usr/share/doc/mex/changelog.gz",
        "644",
    ],
]

[profile.release]
# Release tuning: minimize shipped binary (deb/AUR/brew) at the cost of a
# slower release link. mex is I/O-bound (mDNS ingest + TUI render), so
# size-optimized `z` has no measurable runtime cost vs `3`.
# Measured 2026-11-11 (rustc 1.99.1, clean release builds):
# stock unstripped 7.46 MB -> stripped 2.55 MB (strip alone: -66%)
# stripped stock -> abort+cu1+z 1.84 MB (-28%) -> +fat LTO 1.49 MB (-19%)
# `z` vs `3` with LTO: 1.49 vs 1.99 MB (-25%, .text 990 vs 1557 KB).
# Total shippable gain: 2.55 -> 1.49 MB (-42%); clean build cost +7s (10s -> 17s).
codegen-units = 1 # one LLVM unit: best optimization, slowest build (default 16)
# fat LTO: cross-crate inlining + dead-code elim, e.g. ratatui/simple-dns
# (-0.34 MB measured)
lto = true
# min size (O2 + shrink); switch to "3" only if profiling shows a hot loop
opt-level = "z"
# no unwind tables: smaller binary, no catch_unwind (unused here)
panic = "abort"
# emit DWARF into split-debug artifacts (mex.pdb / .dSYM / .dwp per
# platform, each copied best-effort via `|| true`); the binary itself is
# stripped below, no dbgsym package is produced
debug = true
# pack DWARF into .dwp (e.g. ~13 MB mex.dwp in a local Linux release build)
split-debuginfo = "packed"
# strip symbols from shipped binary (-4.9 MB vs unstripped); split-debug
# artifacts (if any) sit alongside the binary, never inside it
strip = true

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
# DNS wire codec only (mex owns sockets/scheduling/suppression): mDNS is
# first-class here — native cache-flush (§10.2) + unicast-response QU
# (§5.4) fields, both pinned by browse tests
simple-dns = "0.13"
socket2 = { version = "0.6", features = ["all"] }
socket-pktinfo = "0.4"
log = "0.4"
chrono = "0.4"
anyhow = "1"
if-addrs = { version = "0.15", features = ["link-local"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
