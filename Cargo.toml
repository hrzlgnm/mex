[package]
name = "mex"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
hickory-proto = { version = "0.24", features = ["mdns"] }
socket2 = { version = "0.6", features = ["all"] }
socket-pktinfo = "0.4"
log = "0.4"
chrono = "0.4"
anyhow = "1"
if-addrs = { version = "0.15", features = ["link-local"] }
clap = { version = "4", features = ["derive"] }
