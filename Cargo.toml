[package]
name = "mex"
version = "0.4.1"
edition = "2021"
license = "MIT"
description = "Terminal UI to browse and debug mDNS/DNS-SD on the local link — live services, records, queries, and raw packets"

[package.metadata.deb]
maintainer = "hrzlgnm"
copyright = "Copyright 2026 hrzlgnm"
license-file = "LICENSE"
depends = "libgcc-s1 (>= 4.2)"
assets = [
    [
        "target/release/mex",
        "usr/bin/",
        "755",
    ],
    [
        "docs/mex.1",
        "usr/share/man/man1/mex.1",
        "644",
    ],
    [
        "packaging/linux/mex.desktop",
        "usr/share/applications/mex.desktop",
        "644",
    ],
    [
        "packaging/linux/mex.svg",
        "usr/share/icons/hicolor/scalable/apps/mex.svg",
        "644",
    ],
    [
        "target/debian/changelog.gz",
        "usr/share/doc/mex/changelog.gz",
        "644",
    ],
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
debug = true
split-debuginfo = "packed"
strip = true

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
hickory-proto = { version = "0.26", features = ["mdns"] }
socket2 = { version = "0.6", features = ["all"] }
socket-pktinfo = "0.4"
log = "0.4"
chrono = "0.4"
anyhow = "1"
if-addrs = { version = "0.15", features = ["link-local"] }
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
